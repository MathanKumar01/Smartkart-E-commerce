<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — SmartCart</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body, body * { font-family: 'Roboto', sans-serif; }

  body { font-weight: 400; }
  h1, h2, h3, h4, h5, h6 { font-weight: 700; }
  button, [class*="btn-"] { font-weight: 500; }

  :root {
    --ink: #0d0d14;
    --indigo: #4338f7;
    --indigo-light: #6d63ff;
    --indigo-dim: rgba(67,56,247,0.08);
    --surface: #ffffff;
    --bg: #f5f5f8;
    --muted: #8a8a99;
    --border: #e8e8ef;
    --green: #00b07a;
    --green-soft: rgba(0,176,122,0.1);
    --green-border: rgba(0,176,122,0.2);
  }

  html { font-size: 16px; }
  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── NAVBAR ── */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 clamp(16px, 4vw, 48px);
    height: 68px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand-icon {
    width: 34px; height: 34px; background: var(--indigo);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 800; color: #fff;
    box-shadow: 0 4px 12px rgba(67,56,247,0.3);
  }
  .brand-name {
    font-family: 'Syne', sans-serif;
    font-size: 20px; font-weight: 800;
    letter-spacing: -0.03em; color: var(--ink);
  }
  .brand-name span { color: var(--indigo); }

  .nav-right { display: flex; align-items: center; gap: 10px; }
  .user-pill {
    display: flex; align-items: center; gap: 8px;
    background: var(--indigo-dim);
    border: 1px solid rgba(67,56,247,0.15);
    border-radius: 100px;
    padding: 6px 14px 6px 6px;
    font-size: 13px; font-weight: 500; color: var(--ink);
  }
  .avatar {
    width: 28px; height: 28px; background: var(--indigo); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 12px; font-weight: 700; color: #fff;
  }
  .btn-logout {
    padding: 8px 18px; background: transparent;
    border: 1.5px solid var(--border); border-radius: 100px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500; color: var(--muted);
    cursor: pointer; text-decoration: none; transition: all 0.2s;
  }
  .btn-logout:hover { border-color: var(--indigo); color: var(--indigo); background: var(--indigo-dim); }

  /* ── MAIN ── */
  main {
    max-width: 560px; margin: 0 auto;
    padding: 64px clamp(16px, 4vw, 32px) 80px;
    display: flex; flex-direction: column; align-items: center; gap: 36px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── GREETING ── */
  .greeting {
    text-align: center;
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.1s both;
  }
  .greeting h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(24px, 5vw, 34px); font-weight: 800;
    letter-spacing: -0.03em; color: var(--ink); line-height: 1.2;
  }
  .greeting h1 em { font-style: normal; color: var(--indigo); }
  .greeting p { font-size: 14px; color: var(--muted); margin-top: 8px; }

  /* ── STATS ── */
  .stats {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 14px; width: 100%;
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.2s both;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px; padding: 28px 20px;
    text-align: center;
    box-shadow: 0 2px 16px rgba(13,13,20,0.05);
    transition: transform 0.25s, box-shadow 0.25s;
  }
  .stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(13,13,20,0.09); }

  .stat-icon-wrap {
    width: 48px; height: 48px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 14px; font-size: 22px;
  }
  .stat-card.indigo .stat-icon-wrap {
    background: var(--indigo-dim);
    border: 1px solid rgba(67,56,247,0.15);
  }
  .stat-card.green .stat-icon-wrap {
    background: var(--green-soft);
    border: 1px solid var(--green-border);
  }

  .stat-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
  }
  .stat-value {
    font-family: 'Syne', sans-serif;
    font-size: 36px; font-weight: 800;
    letter-spacing: -0.03em; line-height: 1;
  }
  .stat-card.indigo .stat-value { color: var(--indigo); }
  .stat-card.green .stat-value  { color: var(--green); }
  .stat-value .sym { font-size: 18px; font-weight: 600; opacity: 0.6; }

  /* ── CTA ── */
  .cta-wrap {
    width: 100%;
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.32s both;
  }
  .btn-shop {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 17px;
    background: var(--indigo); color: #fff;
    border: none; border-radius: 14px;
    font-family: 'Syne', sans-serif;
    font-size: 16px; font-weight: 700; letter-spacing: -0.01em;
    cursor: pointer; text-decoration: none;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 24px rgba(67,56,247,0.28);
  }
  .btn-shop:hover {
    background: var(--indigo-light); transform: translateY(-2px);
    box-shadow: 0 10px 32px rgba(67,56,247,0.38); color: #fff;
  }
  .btn-shop:active { transform: translateY(0); }
  .btn-shop .arrow { display: inline-block; transition: transform 0.2s; }
  .btn-shop:hover .arrow { transform: translateX(5px); }

  .secondary-links {
    display: flex; justify-content: center; gap: 24px;
    margin-top: 18px;
  }
  .secondary-links a {
    font-size: 13px; color: var(--muted);
    text-decoration: none; font-weight: 500; transition: color 0.18s;
  }
  .secondary-links a:hover { color: var(--indigo); }

  /* ── MOBILE ── */
  @media (max-width: 480px) {
    .stats { grid-template-columns: 1fr; }
    .stat-value { font-size: 30px; }
    .user-pill span:not(.avatar) {
      max-width: 90px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
  }
</style>
</head>
<body>

<!-- NAVBAR -->
<nav>
  <a class="brand" href="/">
    <div class="brand-icon">S</div>
    <span class="brand-name">Smart<span>Cart</span></span>
  </a>
  <div class="nav-right">
    <div class="user-pill">
      <div class="avatar">{{ user.username|first|upper }}</div>
      {{ user.username }}
    </div>
    <a href="/users/logout/" class="btn-logout">Sign out</a>
  </div>
</nav>

<!-- MAIN -->
<main>

  <div class="greeting">
    <h1>Welcome back, <em>{{ user.username }}</em></h1>
    <p>Here's a quick look at your activity.</p>
  </div>

  <div class="stats">
    <div class="stat-card indigo">
      <div class="stat-icon-wrap">📋</div>
      <div class="stat-label">Total Orders</div>
      <div class="stat-value">{{ order_count|default:"0" }}</div>
    </div>
    <div class="stat-card green">
      <div class="stat-icon-wrap">💰</div>
      <div class="stat-label">Total Spent</div>
      <div class="stat-value"><span class="sym">₹</span>{{ total_spent|default:"0" }}</div>
    </div>
  </div>

  <div class="cta-wrap">
    <a href="/" class="btn-shop">
      Start Shopping <span class="arrow">→</span>
    </a>
    <div class="secondary-links">
      <a href="/orders/">My Orders</a>
      <a href="/cart/">Cart</a>
      <a href="/wishlist/">Wishlist</a>
    </div>
  </div>

</main>

</body>
</html>
