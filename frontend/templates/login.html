<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body, body * { font-family: 'Roboto', sans-serif; }

  body { font-weight: 400; }
  h1, h2, h3, h4, h5, h6 { font-weight: 700; }
  button, [class*="btn-"] { font-weight: 500; }

  :root {
    --ink: #0d0d14;
    --indigo: #4338f7;
    --indigo-light: #6d63ff;
    --indigo-dim: rgba(67,56,247,0.08);
    --surface: #ffffff;
    --bg: #f5f5f8;
    --muted: #8a8a99;
    --border: #e8e8ef;
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 70% 60% at 20% 30%, rgba(67,56,247,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 70% at 80% 70%, rgba(67,56,247,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  .card {
    position: relative; z-index: 1;
    width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 44px 40px;
    box-shadow: 0 8px 48px rgba(13,13,20,0.08), 0 2px 8px rgba(13,13,20,0.04);
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .header { text-align: center; margin-bottom: 36px; }

  .logo-mark {
    width: 52px; height: 52px;
    background: var(--indigo);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-size: 22px; font-weight: 800; color: #fff;
    letter-spacing: -0.03em;
    box-shadow: 0 6px 20px rgba(67,56,247,0.3);
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.08s both;
  }

  h1 {
    font-size: 24px; font-weight: 700;
    letter-spacing: -0.02em; color: var(--ink);
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.12s both;
  }

  .subtitle {
    font-size: 13px; font-weight: 400;
    color: var(--muted); margin-top: 5px;
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.16s both;
  }

  .field {
    margin-bottom: 18px;
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }
  .field:nth-child(1) { animation-delay: 0.2s; }
  .field:nth-child(2) { animation-delay: 0.26s; }

  label {
    display: block;
    font-size: 12px; font-weight: 600;
    color: var(--ink); margin-bottom: 7px;
    letter-spacing: -0.01em;
  }

  input {
    width: 100%;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 14px; font-weight: 400;
    color: var(--ink); outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }

  input::placeholder { color: var(--muted); }

  input:focus {
    border-color: var(--indigo);
    background: var(--surface);
    box-shadow: 0 0 0 3px rgba(67,56,247,0.1);
  }

  .btn-login {
    width: 100%; margin-top: 6px;
    padding: 13px;
    background: var(--indigo);
    border: none; border-radius: 10px;
    font-family: inherit;
    font-size: 14px; font-weight: 600;
    letter-spacing: -0.01em;
    color: #fff; cursor: pointer;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(67,56,247,0.25);
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.34s both;
  }

  .btn-login:hover {
    background: var(--indigo-light);
    transform: translateY(-1px);
    box-shadow: 0 8px 28px rgba(67,56,247,0.35);
  }
  .btn-login:active { transform: translateY(0); }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 22px 0 16px;
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.38s both;
  }
  .divider-line { flex: 1; height: 1px; background: var(--border); }
  .divider span { font-size: 12px; color: var(--muted); }

  .forgot {
    text-align: center;
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.42s both;
  }
  .forgot a {
    font-size: 13px; font-weight: 500;
    color: var(--indigo); text-decoration: none;
    transition: color 0.18s;
  }
  .forgot a:hover { color: var(--indigo-light); }

  /* ── REGISTER LINE ── */
  .register {
    text-align: center; margin-top: 14px;
    font-size: 13px; color: var(--muted);
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.46s both;
  }
  .register a {
    font-weight: 600; color: var(--indigo);
    text-decoration: none; transition: color 0.18s;
  }
  .register a:hover { color: var(--indigo-light); }

  .brand-footer {
    text-align: center; margin-top: 28px;
    padding-top: 20px; border-top: 1px solid var(--border);
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.5s both;
  }
  .brand-name {
    font-size: 15px; font-weight: 800;
    letter-spacing: -0.02em; color: var(--ink);
    text-decoration: none;
  }
  .brand-name span { color: var(--indigo); }

  .error-box {
    margin-bottom: 14px;
    background: #fff1f2;
    border: 1px solid #fecdd3;
    color: #9f1239;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 500;
  }

  .password-wrap {
    position: relative;
  }

  .toggle-pass {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 6px;
  }

  .toggle-pass:hover {
    color: var(--indigo);
    background: var(--indigo-dim);
  }

  .caps-hint {
    margin-top: 6px;
    font-size: 12px;
    color: #b91c1c;
    display: none;
  }

  #splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: linear-gradient(130deg, #3328db 0%, #5e54ff 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    transition: opacity 0.45s ease, visibility 0.45s ease;
  }

  #splash.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .splash-logo {
    width: 72px;
    height: 72px;
    border-radius: 22px;
    background: rgba(255,255,255,0.16);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 38px;
    font-weight: 800;
    box-shadow: 0 12px 34px rgba(13,13,20,0.24);
    animation: splashPop 0.55s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  .splash-text {
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .splash-track {
    width: 130px;
    height: 3px;
    border-radius: 999px;
    overflow: hidden;
    background: rgba(255,255,255,0.25);
  }

  .splash-fill {
    height: 100%;
    width: 0;
    background: #fff;
    animation: fillSplash 1s ease forwards;
  }

  @keyframes splashPop {
    from { opacity: 0; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes fillSplash {
    from { width: 0; }
    to { width: 100%; }
  }
</style>
</head>

<body>
  <div id="splash">
    <div class="splash-logo">S</div>
    <div class="splash-text">SmartCart</div>
    <div class="splash-track"><div class="splash-fill"></div></div>
  </div>

  <div class="card">

    <div class="header">
      <div class="logo-mark">S</div>
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to your account</p>
    </div>

    <form id="loginForm" method="POST">
      {% csrf_token %}

      <div id="loginError" class="error-box" {% if not error %}style="display:none"{% endif %}>{{ error }}</div>

      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" name="username"
          placeholder="Enter your username" autocomplete="username" value="{{ username_value }}">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" type="password" name="password"
            placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="toggle-pass" data-target="password">Show</button>
        </div>
        <div id="capsHintLogin" class="caps-hint">Caps Lock is ON</div>
      </div>

      <button type="submit" class="btn-login">Sign In</button>
    </form>

    <div class="divider">
      <div class="divider-line"></div>
      <span>or</span>
      <div class="divider-line"></div>
    </div>

    <div class="forgot">
      <a href="/password-reset/">Forgot your password?</a>
    </div>

    <div class="register">
      Don't have an account? <a href="/users/register/">Register</a>
    </div>

    <div class="brand-footer">
      <a href="/" class="brand-name">Smart<span>Cart</span></a>
    </div>

  </div>

  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        var splash = document.getElementById('splash');
        if (splash) splash.classList.add('hidden');
      }, 1500);
    });

    (function () {
      var form = document.getElementById('loginForm');
      var errorBox = document.getElementById('loginError');
      var passwordInput = document.getElementById('password');
      var capsHint = document.getElementById('capsHintLogin');

      if (!form || !errorBox) {
        return;
      }

      var toggleButtons = document.querySelectorAll('.toggle-pass');
      toggleButtons.forEach(function (button) {
        button.addEventListener('click', function () {
          var targetId = button.getAttribute('data-target');
          var input = document.getElementById(targetId);
          if (!input) {
            return;
          }
          var isPassword = input.getAttribute('type') === 'password';
          input.setAttribute('type', isPassword ? 'text' : 'password');
          button.textContent = isPassword ? 'Hide' : 'Show';
        });
      });

      if (passwordInput && capsHint) {
        var updateCapsHint = function (event) {
          var on = event.getModifierState && event.getModifierState('CapsLock');
          capsHint.style.display = on ? 'block' : 'none';
        };

        passwordInput.addEventListener('keydown', updateCapsHint);
        passwordInput.addEventListener('keyup', updateCapsHint);
        passwordInput.addEventListener('blur', function () {
          capsHint.style.display = 'none';
        });
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        var submitButton = form.querySelector('button[type="submit"]');
        var csrfInput = form.querySelector('input[name="csrfmiddlewaretoken"]');
        var formData = new FormData(form);

        errorBox.style.display = 'none';
        errorBox.textContent = '';

        if (submitButton) {
          submitButton.disabled = true;
          submitButton.textContent = 'Checking...';
        }

        fetch(form.action || window.location.href, {
          method: 'POST',
          headers: {
            'X-Requested-With': 'XMLHttpRequest',
            'X-CSRFToken': csrfInput ? csrfInput.value : ''
          },
          body: formData,
          credentials: 'same-origin'
        })
          .then(function (response) {
            return response.json().then(function (payload) {
              return { ok: response.ok, payload: payload };
            });
          })
          .then(function (result) {
            if (result.ok && result.payload.ok) {
              window.location.href = result.payload.redirect_url || '/users/dashboard/';
              return;
            }

            errorBox.textContent = result.payload.error || 'Unable to login right now.';
            errorBox.style.display = 'block';
          })
          .catch(function () {
            errorBox.textContent = 'Network error. Please try again.';
            errorBox.style.display = 'block';
          })
          .finally(function () {
            if (submitButton) {
              submitButton.disabled = false;
              submitButton.textContent = 'Sign In';
            }
          });
      });
    })();
  </script>
</body>
</html>
