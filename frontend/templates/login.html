<!DOCTYPE html>
<html lang="en">
<head>
<title>Login</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0d0d14;
    --indigo: #4338f7;
    --indigo-light: #6d63ff;
    --indigo-dim: rgba(67,56,247,0.08);
    --surface: #ffffff;
    --bg: #f5f5f8;
    --muted: #8a8a99;
    --border: #e8e8ef;
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 70% 60% at 20% 30%, rgba(67,56,247,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 70% at 80% 70%, rgba(67,56,247,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  .card {
    position: relative; z-index: 1;
    width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 44px 40px;
    box-shadow: 0 8px 48px rgba(13,13,20,0.08), 0 2px 8px rgba(13,13,20,0.04);
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .header { text-align: center; margin-bottom: 36px; }

  .logo-mark {
    width: 52px; height: 52px;
    background: var(--indigo);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-size: 22px; font-weight: 800; color: #fff;
    letter-spacing: -0.03em;
    box-shadow: 0 6px 20px rgba(67,56,247,0.3);
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.08s both;
  }

  h1 {
    font-size: 24px; font-weight: 700;
    letter-spacing: -0.02em; color: var(--ink);
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.12s both;
  }

  .subtitle {
    font-size: 13px; font-weight: 400;
    color: var(--muted); margin-top: 5px;
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.16s both;
  }

  .field {
    margin-bottom: 18px;
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }
  .field:nth-child(1) { animation-delay: 0.2s; }
  .field:nth-child(2) { animation-delay: 0.26s; }

  label {
    display: block;
    font-size: 12px; font-weight: 600;
    color: var(--ink); margin-bottom: 7px;
    letter-spacing: -0.01em;
  }

  input {
    width: 100%;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 14px; font-weight: 400;
    color: var(--ink); outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }

  input::placeholder { color: var(--muted); }

  input:focus {
    border-color: var(--indigo);
    background: var(--surface);
    box-shadow: 0 0 0 3px rgba(67,56,247,0.1);
  }

  .btn-login {
    width: 100%; margin-top: 6px;
    padding: 13px;
    background: var(--indigo);
    border: none; border-radius: 10px;
    font-family: inherit;
    font-size: 14px; font-weight: 600;
    letter-spacing: -0.01em;
    color: #fff; cursor: pointer;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(67,56,247,0.25);
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.34s both;
  }

  .btn-login:hover {
    background: var(--indigo-light);
    transform: translateY(-1px);
    box-shadow: 0 8px 28px rgba(67,56,247,0.35);
  }
  .btn-login:active { transform: translateY(0); }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 22px 0 16px;
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.38s both;
  }
  .divider-line { flex: 1; height: 1px; background: var(--border); }
  .divider span { font-size: 12px; color: var(--muted); }

  .forgot {
    text-align: center;
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.42s both;
  }
  .forgot a {
    font-size: 13px; font-weight: 500;
    color: var(--indigo); text-decoration: none;
    transition: color 0.18s;
  }
  .forgot a:hover { color: var(--indigo-light); }

  /* ── REGISTER LINE ── */
  .register {
    text-align: center; margin-top: 14px;
    font-size: 13px; color: var(--muted);
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.46s both;
  }
  .register a {
    font-weight: 600; color: var(--indigo);
    text-decoration: none; transition: color 0.18s;
  }
  .register a:hover { color: var(--indigo-light); }

  .brand-footer {
    text-align: center; margin-top: 28px;
    padding-top: 20px; border-top: 1px solid var(--border);
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.5s both;
  }
  .brand-name {
    font-size: 15px; font-weight: 800;
    letter-spacing: -0.02em; color: var(--ink);
    text-decoration: none;
  }
  .brand-name span { color: var(--indigo); }
</style>
</head>

<body>
  <div class="card">

    <div class="header">
      <div class="logo-mark">S</div>
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to your account</p>
    </div>

    <form method="POST">
      {% csrf_token %}

      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" name="username"
          placeholder="Enter your username" autocomplete="username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password"
          placeholder="••••••••" autocomplete="current-password">
      </div>

      <button type="submit" class="btn-login">Sign In</button>
    </form>

    <div class="divider">
      <div class="divider-line"></div>
      <span>or</span>
      <div class="divider-line"></div>
    </div>

    <div class="forgot">
      <a href="/password-reset/">Forgot your password?</a>
    </div>

    <div class="register">
      Don't have an account? <a href="/users/register/">Register</a>
    </div>

    <div class="brand-footer">
      <a href="/" class="brand-name">Smart<span>Cart</span></a>
    </div>

  </div>
</body>
</html>
