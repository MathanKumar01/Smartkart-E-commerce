<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set New Password — SmartCart</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #0d0d14; --indigo: #4338f7; --indigo-light: #6d63ff;
    --indigo-dim: rgba(67,56,247,0.08); --surface: #ffffff;
    --bg: #f5f5f8; --muted: #8a8a99; --border: #e8e8ef;
    --red: #f03e3e; --red-dim: rgba(240,62,62,0.08);
  }
  body {
    min-height: 100vh; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Sans', sans-serif; padding: 24px;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 70% 60% at 20% 30%, rgba(67,56,247,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 70% at 80% 70%, rgba(67,56,247,0.04) 0%, transparent 60%);
    pointer-events: none;
  }
  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 420px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 48px 44px 40px;
    box-shadow: 0 8px 48px rgba(13,13,20,0.08), 0 2px 8px rgba(13,13,20,0.04);
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .header { text-align: center; margin-bottom: 36px; }
  .logo-mark {
    width: 52px; height: 52px; background: var(--indigo);
    border-radius: 14px; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-family: 'Syne', sans-serif;
    font-size: 22px; font-weight: 800; color: #fff;
    box-shadow: 0 6px 20px rgba(67,56,247,0.3);
  }
  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink);
  }
  .subtitle { font-size: 13px; color: var(--muted); margin-top: 5px; }

  .alert-error {
    background: var(--red-dim); border: 1px solid rgba(240,62,62,0.2);
    border-radius: 10px; padding: 12px 14px;
    font-size: 13px; color: var(--red);
    margin-bottom: 20px; line-height: 1.5;
  }

  .field { margin-bottom: 18px; }
  label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--ink); margin-bottom: 7px; letter-spacing: -0.01em;
  }
  input {
    width: 100%; background: var(--bg);
    border: 1.5px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-family: 'DM Sans', sans-serif;
    font-size: 14px; color: var(--ink); outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }
  input::placeholder { color: var(--muted); }
  input:focus {
    border-color: var(--indigo); background: var(--surface);
    box-shadow: 0 0 0 3px rgba(67,56,247,0.1);
  }
  .btn-submit {
    width: 100%; margin-top: 6px; padding: 13px;
    background: var(--indigo); border: none; border-radius: 10px;
    font-family: 'Syne', sans-serif;
    font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
    color: #fff; cursor: pointer;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(67,56,247,0.25);
  }
  .btn-submit:hover {
    background: var(--indigo-light); transform: translateY(-1px);
    box-shadow: 0 8px 28px rgba(67,56,247,0.35);
  }
  .btn-submit:active { transform: translateY(0); }

  .brand-footer {
    text-align: center; margin-top: 28px;
    padding-top: 20px; border-top: 1px solid var(--border);
  }
  .brand-footer a {
    font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 800;
    letter-spacing: -0.02em; color: var(--ink); text-decoration: none;
  }
  .brand-footer a span { color: var(--indigo); }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo-mark">S</div>
      <h1>Set New Password</h1>
      <p class="subtitle">Choose a strong password for your account</p>
    </div>

    <form method="POST">
      {% csrf_token %}

      {% if form.errors %}
      <div class="alert-error">
        {{ form.errors }}
      </div>
      {% endif %}

      <div class="field">
        <label>New Password</label>
        {{ form.new_password1 }}
      </div>

      <div class="field">
        <label>Confirm Password</label>
        {{ form.new_password2 }}
      </div>

      <button type="submit" class="btn-submit">Reset Password</button>
    </form>

    <div class="brand-footer">
      <a href="/">Smart<span>Cart</span></a>
    </div>
  </div>
</body>
</html>
