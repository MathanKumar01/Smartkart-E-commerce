<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check Your Email — SmartCart</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #0d0d14; --indigo: #4338f7; --indigo-light: #6d63ff;
    --indigo-dim: rgba(67,56,247,0.08); --surface: #ffffff;
    --bg: #f5f5f8; --muted: #8a8a99; --border: #e8e8ef;
    --green: #00b07a; --green-soft: rgba(0,176,122,0.1);
  }
  body {
    min-height: 100vh; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Sans', sans-serif; padding: 24px;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 70% 60% at 20% 30%, rgba(67,56,247,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 70% at 80% 70%, rgba(67,56,247,0.04) 0%, transparent 60%);
    pointer-events: none;
  }
  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 420px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 48px 44px 40px;
    box-shadow: 0 8px 48px rgba(13,13,20,0.08), 0 2px 8px rgba(13,13,20,0.04);
    text-align: center;
    animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .check-circle {
    width: 64px; height: 64px;
    background: var(--green-soft);
    border: 2px solid rgba(0,176,122,0.25);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
    font-size: 28px;
    animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.2s both;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.5); }
    to   { opacity: 1; transform: scale(1); }
  }
  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
    color: var(--ink); margin-bottom: 10px;
  }
  p { font-size: 14px; color: var(--muted); line-height: 1.7; margin-bottom: 28px; }
  .btn-login {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--indigo); color: #fff;
    border: none; border-radius: 10px;
    padding: 13px 32px;
    font-family: 'Syne', sans-serif;
    font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
    cursor: pointer; text-decoration: none;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(67,56,247,0.25);
  }
  .btn-login:hover {
    background: var(--indigo-light); transform: translateY(-1px);
    box-shadow: 0 8px 28px rgba(67,56,247,0.35); color: #fff;
  }
  .brand-footer {
    margin-top: 32px; padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .brand-footer a {
    font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 800;
    letter-spacing: -0.02em; color: var(--ink); text-decoration: none;
  }
  .brand-footer a span { color: var(--indigo); }
</style>
</head>
<body>
  <div class="card">
    <div class="check-circle">✉️</div>
    <h1>Check your inbox</h1>
    <p>We've sent a password reset link to your email. It may take a minute to arrive — check your spam folder too.</p>
    <a href="/users/login/" class="btn-login">Back to Login →</a>
    <div class="brand-footer">
      <a href="/">Smart<span>Cart</span></a>
    </div>
  </div>
</body>
</html>
