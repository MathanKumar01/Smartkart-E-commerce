<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check Your Email — SmartCart</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink:#12121a; --brand:#2563eb; --brand-h:#1d4ed8; --brand-dim:rgba(37,99,235,0.09);
  --surface:#fff; --bg:#f4f5f9; --bg2:#eef0f6; --muted:#7e7e9a; --border:#e2e4ee; --border2:#ececf4;
  --green:#059669; --green-d:rgba(5,150,105,0.10); --green-b:rgba(5,150,105,0.2);
  --font-d:'Playfair Display',Georgia,serif; --font-b:'Outfit',system-ui,sans-serif;
  --sb:0 6px 22px rgba(37,99,235,0.28);
}
body{min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--font-b);padding:24px;-webkit-font-smoothing:antialiased;}
body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 60% 55% at 15% 25%,rgba(37,99,235,0.07) 0%,transparent 65%),radial-gradient(ellipse 50% 60% at 85% 75%,rgba(37,99,235,0.05) 0%,transparent 65%);pointer-events:none;}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:translateY(0);}}
@keyframes popIn{from{opacity:0;transform:scale(0.6);}to{opacity:1;transform:scale(1);}}
.wrap{position:relative;z-index:1;width:100%;max-width:420px;animation:fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both;}
.card{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:44px 40px 36px;box-shadow:0 8px 48px rgba(10,10,18,0.09),0 2px 8px rgba(10,10,18,0.04);text-align:center;}
.check-circle{width:68px;height:68px;background:var(--green-d);border:2px solid var(--green-b);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:30px;animation:popIn 0.55s cubic-bezier(0.34,1.56,0.64,1) 0.2s both;}
h1{font-family:var(--font-d);font-size:22px;font-weight:700;color:var(--ink);margin-bottom:10px;}
p{font-size:14px;color:var(--muted);line-height:1.75;margin-bottom:28px;}
.btn-login{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;border:none;border-radius:11px;padding:13px 28px;font-family:var(--font-d);font-size:14px;font-weight:600;letter-spacing:-0.01em;cursor:pointer;text-decoration:none;transition:background 0.2s,transform 0.15s,box-shadow 0.2s;box-shadow:var(--sb);}
.btn-login:hover{background:var(--brand-h);transform:translateY(-1px);box-shadow:0 10px 28px rgba(37,99,235,0.38);color:#fff;}
.card-footer{margin-top:28px;padding-top:20px;border-top:1px solid var(--border2);}
.card-footer a{font-family:var(--font-d);font-size:14px;font-weight:700;color:var(--ink);text-decoration:none;}
.card-footer a em{font-style:normal;color:var(--brand);}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="check-circle">✉️</div>
    <h1>Check your inbox</h1>
    <p>We've sent a password reset link to your email address. It may take a minute — check your spam folder too.</p>
    <a href="/users/login/" class="btn-login">Back to Sign In →</a>
    <div class="card-footer"><a href="/">Smart<em>Cart</em></a></div>
  </div>
</div>
</body>
</html>
