<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Failed — SmartCart</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #10131a;
    --bg: #fff5f5;
    --card: #ffffff;
    --border: #f0d5d5;
    --brand: #4338f7;
    --muted: #6b7384;
    --red: #e53e3e;
    --red-dim: rgba(229,62,62,0.09);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 8px 32px rgba(229,62,62,0.1);
  }

  .fail-icon {
    width: 72px; height: 72px;
    background: var(--red-dim);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin-bottom: 20px;
    animation: shake 0.5s ease-in-out;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--red);
    margin-bottom: 10px;
  }

  p {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.55;
    margin-bottom: 28px;
  }

  .reasons {
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 28px;
    text-align: left;
  }
  .reasons p {
    font-size: 12px;
    color: var(--red);
    margin: 0 0 4px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .reasons ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .reasons li {
    font-size: 13px;
    color: #7f1d1d;
    padding: 3px 0;
    margin: 0;
  }
  .reasons li::before { content: '• '; opacity: 0.6; }

  .actions { display: flex; flex-direction: column; gap: 10px; }

  .btn-retry {
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: 11px;
    padding: 14px;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    display: block;
    transition: background 0.2s, transform 0.15s;
    box-shadow: 0 4px 16px rgba(67,56,247,0.25);
  }
  .btn-retry:hover { background: #6d63ff; transform: translateY(-2px); color: #fff; }

  .btn-cart {
    background: transparent;
    color: var(--muted);
    border: 1.5px solid #e2e8f0;
    border-radius: 11px;
    padding: 13px;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    display: block;
    transition: border-color 0.18s, color 0.18s;
  }
  .btn-cart:hover { border-color: var(--ink); color: var(--ink); }
</style>
</head>
<body>
<div class="card">
  <div class="fail-icon">✕</div>
  <h1>Payment Failed</h1>
  <p>Your payment could not be processed. No amount has been charged from your account.</p>

  <div class="reasons">
    <p>Possible reasons</p>
    <ul>
      <li>Incorrect card number or CVV</li>
      <li>Card expired or insufficient balance</li>
      <li>Bank declined the transaction</li>
      <li>Network timeout during payment</li>
    </ul>
  </div>

  <div class="actions">
    <a href="/cart/" class="btn-retry">Try Again →</a>
    <a href="/" class="btn-cart">← Back to Shopping</a>
  </div>
</div>
</body>
</html>
