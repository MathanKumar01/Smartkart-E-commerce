<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Failed — SmartCart</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink:#12121a; --brand:#2563eb; --brand-h:#1d4ed8;
  --surface:#fff; --bg:#fff5f5; --muted:#7e7e9a;
  --red:#dc2626; --red-d:rgba(220,38,38,0.09); --red-b:rgba(220,38,38,0.2);
  --font-d:'Playfair Display',Georgia,serif; --font-b:'Outfit',system-ui,sans-serif;
  --sb:0 6px 22px rgba(37,99,235,0.28);
}
body{min-height:100vh;background:var(--bg);display:grid;place-items:center;font-family:var(--font-b);padding:24px;-webkit-font-smoothing:antialiased;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--red-b);border-radius:20px;padding:40px 34px;text-align:center;box-shadow:0 8px 32px rgba(220,38,38,0.10);}
.fail-ico{width:70px;height:70px;background:var(--red-d);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:20px;animation:shake 0.5s ease-in-out;}
h1{font-family:var(--font-d);font-size:24px;font-weight:700;color:var(--red);margin-bottom:9px;}
.sub{font-size:13.5px;color:var(--muted);line-height:1.65;margin-bottom:22px;}
.reasons{background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:14px 18px;margin-bottom:24px;text-align:left;}
.reasons-lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--red);margin-bottom:8px;}
.reasons ul{list-style:none;padding:0;}
.reasons li{font-size:12.5px;color:#7f1d1d;padding:3px 0;}
.reasons li::before{content:'• ';opacity:0.6;}
.actions{display:flex;flex-direction:column;gap:10px;}
.btn-retry{background:var(--brand);color:#fff;border:none;border-radius:11px;padding:13px;font-family:var(--font-d);font-size:15px;font-weight:700;text-decoration:none;display:block;transition:background 0.2s,transform 0.15s;box-shadow:var(--sb);}
.btn-retry:hover{background:var(--brand-h);transform:translateY(-2px);color:#fff;}
.btn-back{background:transparent;color:var(--muted);border:1.5px solid #e2e4ee;border-radius:11px;padding:12px;font-size:13.5px;font-weight:500;text-decoration:none;display:block;transition:border-color 0.18s,color 0.18s;}
.btn-back:hover{border-color:var(--ink);color:var(--ink);}
</style>
</head>
<body>
<div class="card">
  <div class="fail-ico">✕</div>
  <h1>Payment Failed</h1>
  <p class="sub">Your payment could not be processed. No amount has been charged from your account.</p>
  <div class="reasons">
    <div class="reasons-lbl">Possible reasons</div>
    <ul>
      <li>Incorrect card number or CVV</li>
      <li>Card expired or insufficient balance</li>
      <li>Transaction declined by your bank</li>
      <li>Network timeout during payment</li>
    </ul>
  </div>
  <div class="actions">
    <a href="/cart/" class="btn-retry">Try Again →</a>
    <a href="/" class="btn-back">← Back to Shopping</a>
  </div>
</div>
</body>
</html>
