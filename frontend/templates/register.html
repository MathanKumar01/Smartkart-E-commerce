<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account — SmartCart</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink:#12121a; --brand:#2563eb; --brand-h:#1d4ed8;
  --brand-dim:rgba(37,99,235,0.09); --surface:#fff; --bg:#f4f5f9; --bg2:#eef0f6;
  --muted:#7e7e9a; --muted2:#b0b0c8; --border:#e2e4ee; --border2:#ececf4;
  --red:#dc2626; --red-d:rgba(220,38,38,0.09);
  --font-d:'Playfair Display',Georgia,serif; --font-b:'Outfit',system-ui,sans-serif;
  --sb:0 6px 22px rgba(37,99,235,0.28);
}
body { min-height:100vh; background:var(--bg); display:flex; align-items:center; justify-content:center; font-family:var(--font-b); padding:24px; -webkit-font-smoothing:antialiased; }
body::before { content:''; position:fixed; inset:0; z-index:0; background: radial-gradient(ellipse 60% 55% at 15% 25%, rgba(37,99,235,0.07) 0%, transparent 65%), radial-gradient(ellipse 50% 60% at 85% 75%, rgba(37,99,235,0.05) 0%, transparent 65%); pointer-events:none; }
@keyframes fadeUp { from{opacity:0;transform:translateY(22px);} to{opacity:1;transform:translateY(0);} }
.wrap { position:relative; z-index:1; width:100%; max-width:440px; animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both; }
.brand-top { text-align:center; margin-bottom:24px; }
.brand-ico { width:50px; height:50px; border-radius:15px; background:var(--brand); display:inline-grid; place-items:center; font-family:var(--font-d); font-size:21px; font-weight:700; color:#fff; box-shadow:var(--sb); margin-bottom:10px; }
.brand-name { font-family:var(--font-d); font-size:24px; font-weight:700; color:var(--ink); }
.brand-name em { font-style:normal; color:var(--brand); }
.card { background:var(--surface); border:1px solid var(--border2); border-radius:20px; padding:32px 36px 28px; box-shadow:0 8px 48px rgba(10,10,18,0.09), 0 2px 8px rgba(10,10,18,0.04); }
.card-hdr { margin-bottom:24px; }
.card-title { font-family:var(--font-d); font-size:21px; font-weight:700; color:var(--ink); margin-bottom:4px; }
.card-sub { font-size:13px; color:var(--muted); }
.err-box { background:var(--red-d); border:1px solid rgba(220,38,38,0.18); border-radius:10px; padding:11px 14px; font-size:13px; color:var(--red); font-weight:500; margin-bottom:16px; }
.field { margin-bottom:15px; }
.field-label { display:block; font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
.pw-wrap { position:relative; }
.field-input { width:100%; background:var(--bg2); border:1.5px solid var(--border); border-radius:11px; padding:11px 14px; font-family:var(--font-b); font-size:14px; color:var(--ink); outline:none; transition:border-color 0.2s, box-shadow 0.2s, background 0.2s; }
.field-input::placeholder { color:var(--muted2); }
.field-input:focus { border-color:var(--brand); background:var(--surface); box-shadow:0 0 0 3px var(--brand-dim); }
.toggle-pw { position:absolute; right:10px; top:50%; transform:translateY(-50%); border:none; background:transparent; color:var(--muted); font-size:12px; font-weight:600; cursor:pointer; padding:6px 8px; border-radius:6px; font-family:var(--font-b); transition:color 0.18s, background 0.18s; }
.toggle-pw:hover { color:var(--brand); background:var(--brand-dim); }
.caps-hint { margin-top:5px; font-size:11.5px; color:var(--red); display:none; }
.pw-rules { margin-top:6px; font-size:11.5px; color:var(--muted2); line-height:1.5; }
.btn-submit { width:100%; margin-top:6px; padding:13px; background:var(--brand); border:none; border-radius:11px; font-family:var(--font-d); font-size:15px; font-weight:600; letter-spacing:-0.01em; color:#fff; cursor:pointer; transition:background 0.2s, transform 0.15s, box-shadow 0.2s; box-shadow:var(--sb); }
.btn-submit:hover { background:var(--brand-h); transform:translateY(-1px); box-shadow:0 10px 28px rgba(37,99,235,0.38); }
.divider { display:flex; align-items:center; gap:12px; margin:20px 0 14px; }
.div-line { flex:1; height:1px; background:var(--border2); }
.div-txt { font-size:11px; color:var(--muted2); }
.link-row { text-align:center; font-size:13px; color:var(--muted); }
.link-row a { color:var(--brand); font-weight:600; text-decoration:none; }
.link-row a:hover { color:var(--brand-h); }
.card-footer { text-align:center; margin-top:20px; padding-top:18px; border-top:1px solid var(--border2); }
.card-footer a { font-family:var(--font-d); font-size:14px; font-weight:700; color:var(--ink); text-decoration:none; }
.card-footer a em { font-style:normal; color:var(--brand); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand-top">
    <div class="brand-ico">S</div>
    <div class="brand-name">Smart<em>Cart</em></div>
  </div>
  <div class="card">
    <div class="card-hdr">
      <h1 class="card-title">Create your account</h1>
      <p class="card-sub">Join thousands of smart shoppers today</p>
    </div>
    <form method="POST">
      {% csrf_token %}
      {% if error %}<div class="err-box">{{ error }}</div>{% endif %}
      <div class="field">
        <label class="field-label" for="username">Username</label>
        <input id="username" class="field-input" type="text" name="username" placeholder="Choose a username" autocomplete="username" value="{{ username_value }}">
      </div>
      <div class="field">
        <label class="field-label" for="email">Email Address</label>
        <input id="email" class="field-input" type="email" name="email" placeholder="your@email.com" autocomplete="email" value="{{ email_value }}">
      </div>
      <div class="field">
        <label class="field-label" for="password">Password</label>
        <div class="pw-wrap">
          <input id="password" class="field-input" type="password" name="password" placeholder="••••••••" autocomplete="new-password" style="padding-right:70px">
          <button type="button" class="toggle-pw" data-target="password">Show</button>
        </div>
        <div id="capsHint" class="caps-hint">⚠ Caps Lock is on</div>
        <div class="pw-rules">8+ chars · 1 uppercase · 1 number · 1 special character</div>
      </div>
      <button type="submit" class="btn-submit">Create Account →</button>
    </form>
    <div class="divider"><div class="div-line"></div><span class="div-txt">or</span><div class="div-line"></div></div>
    <div class="link-row">Already have an account? <a href="/users/login/">Sign In →</a></div>
    <div class="card-footer"><a href="/">Smart<em>Cart</em></a></div>
  </div>
</div>
<script>
(function(){
  var pw = document.getElementById('password'), ch = document.getElementById('capsHint');
  document.querySelectorAll('.toggle-pw').forEach(function(b) {
    b.addEventListener('click', function() {
      var inp = document.getElementById(b.dataset.target), isPw = inp.type==='password';
      inp.type = isPw ? 'text':'password'; b.textContent = isPw ? 'Hide':'Show';
    });
  });
  if(pw && ch) {
    var fn = function(e) { ch.style.display = (e.getModifierState && e.getModifierState('CapsLock')) ? 'block':'none'; };
    pw.addEventListener('keydown',fn); pw.addEventListener('keyup',fn);
    pw.addEventListener('blur', function(){ ch.style.display='none'; });
  }
})();
</script>
</body>
</html>
